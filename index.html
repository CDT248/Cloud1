
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101c32">
<title>Multi Drive Storage Pro</title>
<link rel="icon" href="https://cdn-icons-png.flaticon.com/128/2818/2818765.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
--bg:#f2f5fb;--card:#fff;--text:#17243a;--muted:#718096;
--border:#e1e8f2;--blue:#356dff;--green:#12b886;
--red:#f05b65;--shadow:0 10px 30px rgba(25,45,80,.07)
}
@media(prefers-color-scheme:dark){
:root{--bg:#08111f;--card:#111d30;--text:#edf3ff;--muted:#9aa9bf;--border:#26354b;--shadow:0 10px 30px #0003}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Hind Siliguri',sans-serif;line-height:1.5}
button,input,select{font:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.5;cursor:not-allowed}
.wrap{max-width:1100px;margin:auto;padding:0 18px 45px}
#gate{min-height:100vh;display:grid;place-items:center;padding:20px}
body.in #gate{display:none}
body:not(.in) .wrap{display:none}
.login{width:100%;max-width:380px;padding:30px;background:var(--card);border:1px solid var(--border);border-radius:25px;text-align:center;box-shadow:var(--shadow)}
.logo{width:75px;height:75px;border-radius:23px;display:grid;place-items:center;margin:auto;background:#e5efff;color:#356dff;font-size:40px}
.login h2{margin:15px 0}
.login input{width:100%;padding:13px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);margin:8px 0}
.hero{background:linear-gradient(120deg,#101b31,#254c87);color:white;margin:0 -18px;padding:25px clamp(18px,4vw,36px) 30px;border-radius:0 0 30px 30px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:19px;font-weight:700}
.toolbar{display:flex;gap:7px;flex-wrap:wrap}
.rf{padding:9px 12px;border-radius:11px;border:1px solid #ffffff35;background:#ffffff12;color:white}
.logout{background:#ef5965;border-color:#ef5965}
.big{font-size:clamp(42px,6vw,65px);font-weight:700;line-height:1.2;margin-top:24px}
.big small{font-size:22px;color:#c2d2eb;margin-left:7px}
.sub{font-size:13px;color:#bdcde5}
.seg{display:flex;gap:4px;height:10px;margin-top:20px}
.seg i{flex:1;background:#ffffff20;border-radius:10px;overflow:hidden}
.seg b{display:block;height:100%}
.legend{display:flex;gap:8px 15px;flex-wrap:wrap;font-size:12px;margin-top:12px;color:#d3dff0}
.legend span:before{content:"";display:inline-block;width:8px;height:8px;background:var(--c);border-radius:50%;margin-right:5px}
.card{margin-top:19px;padding:clamp(16px,3vw,25px);background:var(--card);border:1px solid var(--border);border-radius:23px;box-shadow:var(--shadow)}
h2{font-size:20px;margin:0 0 15px}
.drop{display:block;text-align:center;padding:30px 15px;border:2px dashed #bdcde5;border-radius:22px;cursor:pointer;background:linear-gradient(140deg,#356dff0a,#12b8860a);transition:.2s}
.drop:hover,.drop.on{border-color:var(--blue);background:#356dff10}
.cloud{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;background:linear-gradient(145deg,#e4edff,#c8dcff);color:#356dff;box-shadow:0 10px 28px #356dff25}
.cloud svg{width:48px;height:48px}
.drop.on .cloud{animation:float .7s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-5px)}}
.drop strong{display:block;font-size:18px}
.drop small{display:block;color:var(--muted);margin-top:5px}
.drop input{display:none}
.field{display:flex;gap:10px;margin-top:13px;flex-wrap:wrap}
select{flex:1;min-width:180px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text)}
.btn{border:0;border-radius:12px;padding:12px 19px;background:linear-gradient(130deg,#4c7fff,#2455dc);color:white;font-weight:700;box-shadow:0 6px 16px #356dff25}
.progress{height:8px;border-radius:10px;background:var(--border);overflow:hidden;margin-top:15px;display:none}
.progress i{height:100%;width:0;display:block;background:linear-gradient(90deg,#356dff,#12b886);transition:width .2s}
#st{font-size:13px;color:var(--muted);margin-top:9px;overflow-wrap:anywhere}
#st.ok{color:var(--green)}#st.err{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.account{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:18px;min-width:0;transition:.2s}
.account:hover{border-color:#356dff88;transform:translateY(-2px)}
.ring{width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--border) 0)}
.ring span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);font-size:12px;font-weight:700}
.accountInfo{flex:1;min-width:0}
.accountName{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.email,.space{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.actions{width:83px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.uploadCircle{position:relative;width:46px;height:46px;border:0;border-radius:50%;background:linear-gradient(145deg,#6490ff,#2455dc);color:white;font-size:24px;box-shadow:0 5px 15px #356dff40}
.uploadCircle.busy{animation:pulse .8s infinite alternate}
.uploadCircle.busy:after{content:"";position:absolute;inset:-5px;border:2px solid #356dff;border-bottom-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes pulse{to{transform:scale(.92)}}
@keyframes spin{to{transform:rotate(360deg)}}
.actStatus{width:100%;font-size:11px;text-align:center;line-height:1.35;color:var(--muted);overflow-wrap:anywhere}
.actStatus.busy{color:var(--blue)}.actStatus.ok{color:var(--green)}.actStatus.err{color:var(--red)}
.mini{width:100%;height:5px;border-radius:8px;background:var(--border);overflow:hidden;display:none}
.mini.show{display:block}.mini i{display:block;width:0;height:100%;background:linear-gradient(90deg,#356dff,#12b886)}
.account.bad{border-color:var(--red)}
.search{display:flex;gap:8px;align-items:center;border:1px solid var(--border);background:var(--bg);padding:4px 12px;border-radius:12px;margin-bottom:12px}
.search input{width:100%;min-width:0;padding:9px 0;border:0;outline:0;background:transparent;color:var(--text)}
.search button{border:0;border-radius:8px;padding:5px 8px;background:var(--border);color:var(--text)}
.file{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);min-width:0}
.file:last-child{border:0}
.fileIcon{width:43px;height:43px;flex:none;border-radius:12px;display:grid;place-items:center;background:#356dff16;color:#356dff;font-size:11px;font-weight:700;text-transform:uppercase}
.fileInfo{flex:1;min-width:0}
.fileName{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fileMeta{font-size:12px;color:var(--muted)}
.fileActions{display:flex;gap:5px}
.smallBtn{padding:7px 9px;border:1px solid var(--border);border-radius:9px;background:transparent;color:var(--text);font-size:12px}
.empty{text-align:center;padding:20px;color:var(--muted);font-size:14px}
.menuWrap{position:relative}
.menuPanel{position:absolute;right:0;top:45px;width:220px;z-index:5;background:var(--card);border:1px solid var(--border);border-radius:15px;padding:15px;box-shadow:var(--shadow);color:var(--text)}
.menuPanel[hidden]{display:none}
.menuPanel label{display:flex;align-items:center;gap:8px}
@media(max-width:520px){
.wrap{padding:0 12px 30px}.hero{margin:0 -12px;padding:20px 15px 25px;border-radius:0 0 25px 25px}
.brand{font-size:16px}.rf{padding:8px 9px;font-size:12px}.card{border-radius:19px}
.account{gap:9px;padding:11px}.ring{width:45px;height:45px}.ring span{width:35px;height:35px}
.actions{width:72px}.uploadCircle{width:42px;height:42px}
.file{gap:7px}.fileIcon{width:36px;height:36px}.fileActions{flex-direction:column}
.smallBtn{padding:6px;font-size:11px}.field .btn{width:100%}
}
</style>
</head>

<body>
<div id="gate">
<form class="login" id="loginForm">
<div class="logo">☁</div>
<h2>Multi Drive Storage Pro</h2>
<input id="password" type="password" placeholder="Storage password" autocomplete="current-password" required>
<button class="btn" id="loginButton">লগইন করুন</button>
<div id="loginError" style="color:var(--red);font-size:13px"></div>
</form>
</div>

<main class="wrap">
<header class="hero">
<div class="top">
<div class="brand">☁ Multi Drive Storage Pro</div>
<div class="toolbar">
<div class="menuWrap">
<button class="rf" id="menuToggle" type="button">☰ Menu</button>
<div class="menuPanel" id="menuPanel" hidden>
<label><input type="checkbox" id="showAccounts" checked> Accounts দেখান</label>
</div>
</div>
<button class="rf" id="refreshButton" type="button">↻ Refresh</button>
<button class="rf logout" id="logoutButton" type="button">Logout</button>
</div>
</div>
<div class="big" id="totalFree">—</div>
<div class="sub" id="storageSummary">Storage সংযোগ হচ্ছে...</div>
<div class="seg" id="storageBars"></div>
<div class="legend" id="storageLegend"></div>
</header>

<section class="card">
<h2>⬆ ফাইল আপলোড</h2>
<label class="drop" id="dropZone">
<div class="cloud">
<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M18 47H14a10 10 0 0 1-1-20 20 20 0 0 1 38-4 12 12 0 0 1 0 24h-5"/>
<path d="M32 49V28M23 37l9-9 9 9"/>
</svg>
</div>
<strong id="dropTitle">ফাইল বাছুন অথবা এখানে টেনে আনুন</strong>
<small id="dropInfo">একসঙ্গে একাধিক ফাইল নির্বাচন করা যাবে</small>
<input type="file" id="fileInput" multiple>
</label>
<div class="field">
<select id="accountSelect" aria-label="আপলোড অ্যাকাউন্ট"></select>
<button class="btn" id="uploadButton" type="button">⬆ Upload Now</button>
</div>
<div class="progress" id="overallProgress"><i id="overallBar"></i></div>
<div id="st">আপলোডের জন্য ফাইল নির্বাচন করুন।</div>
</section>

<section class="card" id="accountsSection">
<h2>☁ Storage Accounts</h2>
<div class="grid" id="accounts"></div>
</section>

<section class="card">
<h2>📁 আপনার ফাইল</h2>
<div class="search">🔎 <input id="fileSearch" type="search" placeholder="ফাইলের নাম লিখে খুঁজুন..."><button id="clearSearch" type="button">✕</button></div>
<div id="files"><div class="empty">ফাইল লোড হচ্ছে...</div></div>
</section>
</main>

<script>
// আপনার বিদ্যমান Apps Script URL-গুলো এখানে রাখা হয়েছে।
const URLS = [
'https://script.google.com/macros/s/AKfycbxHqu9VUs5pzMkTof2amW7VwT6Auriqn7usSCC9QlUax6wfIPFk7VqOYLateKmjZDmx-Q/exec',
'https://script.google.com/macros/s/AKfycbzmSTLgVwTCKPim29hbeSW43O42W5HK4WcY1zJKgGkjKx1dJEN4fSVp931CHLkD9LTMQg/exec',
'https://script.google.com/macros/s/AKfycbyWcjgd-3E1DrOoNr0f3WUDbc4CIxQoFxbYyzjFhoInPGpHcBBA4TQnOhbQ6-8BwU4Y/exec',
'https://script.google.com/macros/s/AKfycbzjg8Pk1aexKAKJq1JALw8VFvVo-fJ8FnniOSgcV81wnWay0bHMr3ZsF4wLpuJJnPvc/exec',
'https://script.google.com/macros/s/AKfycbwZ4wUiHodgYjeAoTqf1LXZju5bnMeddsesnyVAlllwFlegOhET_VFxmN1L6D_yQT6d/exec',
'https://script.google.com/macros/s/AKfycbzbaO7Cq3XkUy9R8vTbZIC4vUb9OdTMzE7NeymGhOhhaMDRe-kIZprmV38-zxESGwZ5/exec',
'https://script.google.com/macros/s/AKfycbykYgqX6pdcVicbKkHLwEKW2uDFDjyUhSKFhuczFX1ipXI5gm9VN299qDv4F2W6nIpBiw/exec',
'https://script.google.com/macros/s/AKfycbxGvXKm5sWr1uWOSuDALE_wMq1g_P3l-B446gxSH2M8yHYFle1bQsTdSwNI_s2uT-Ix/exec',
'https://script.google.com/macros/s/AKfycbxpSbkKPJ81Yy46Z41szbZC80zKHkeoDCZw5BOUzdUByPLALdudp9Jawjyat9dvJRw-kA/exec',
'https://script.google.com/macros/s/AKfycbyP5Pn7JoA0rvUFnjLgr8RcyAnEoIY2LeJCdJ5hvb1YBwcx6L-UcFkVXn05wyAmMkMx/exec',
'https://script.google.com/macros/s/AKfycbxg-aERyiOaFON2lt22PIXPsw2lbObHOTAdyijoovl0cHOcu2cdom-dwrIgM-axS58uMQ/exec',
'https://script.google.com/macros/s/AKfycbxTgoG6wbeaYdiBUWRMke2IZdlcvvMVUce9hy760fuYNtveLMuRCaG_NzOuozoNt6sd/exec',
'','',''
];

const CHUNK_SIZE = 3 * 1024 * 1024;
const COLORS = ['#356dff','#12b886','#f05b65','#f5a623','#8057ed','#e6478f','#14a7d6','#7bb82b','#d9534f','#5a6fd6','#c98a1b','#2aa198','#b85cd6','#4d8f5b','#d6603a'];
const accounts = URLS.map((url,i)=>({url,name:'Account '+(i+1),color:COLORS[i%COLORS.length],space:null,uploading:false,activity:'অপেক্ষমাণ',activityKind:''})).filter(a=>a.url);
let KEY='';

const $=id=>document.getElementById(id);
const make=(tag,cls='',text='')=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=='')e.textContent=text;return e;};
const formatSize=n=>n>=1e9?(n/1e9).toFixed(2)+' GB':n>=1e6?(n/1e6).toFixed(1)+' MB':n>=1e3?(n/1e3).toFixed(0)+' KB':n+' B';

function showStatus(message,type=''){ $('st').textContent=message;$('st').className=type; }

async function get(account,query){
 const response=await fetch(account.url+'?key='+encodeURIComponent(KEY)+'&'+query);
 return response.json();
}
async function post(account,data){
 const response=await fetch(account.url,{
  method:'POST',
  headers:{'Content-Type':'text/plain'},
  body:JSON.stringify({key:KEY,...data})
 });
 return response.json();
}

function fillAccountSelect(){
 const select=$('accountSelect'),old=select.value||'auto';
 select.innerHTML='';
 const auto=make('option','','অটো: বেশি খালি জায়গার অ্যাকাউন্ট');auto.value='auto';select.append(auto);
 accounts.forEach((a,i)=>{
  const option=make('option','',a.name+(a.space?.ok?' • '+formatSize(a.space.free)+' ফ্রি':''));
  option.value=String(i);select.append(option);
 });
 select.value=[...select.options].some(o=>o.value===old)?old:'auto';
}

function renderStorage(){
 let free=0,used=0,limit=0,count=0;
 $('storageBars').innerHTML='';$('storageLegend').innerHTML='';
 accounts.forEach(a=>{
  const s=a.space;if(!s?.ok)return;
  count++;free+=Number(s.free)||0;used+=Number(s.used)||0;limit+=Number(s.limit)||0;
  const segment=make('i');segment.title=a.name;
  const bar=make('b');bar.style.width=(s.limit?Math.min(100,s.used/s.limit*100):0)+'%';bar.style.background=a.color;
  segment.append(bar);$('storageBars').append(segment);
  const label=make('span','',a.name);label.style.setProperty('--c',a.color);$('storageLegend').append(label);
 });
 $('totalFree').innerHTML='';
 $('totalFree').append(document.createTextNode(formatSize(free)));
 $('storageSummary').textContent=count?'মোট '+count+'টি অ্যাকাউন্ট • ব্যবহৃত '+formatSize(used)+' / '+formatSize(limit):'কোনো অ্যাকাউন্ট সংযুক্ত নেই';
}

function renderAccounts(){
 const box=$('accounts');box.innerHTML='';
 if(!accounts.length){box.append(make('div','empty','কোনো Apps Script URL দেওয়া নেই'));return;}
 accounts.forEach((a,index)=>{
  const s=a.space||{ok:false};
  const card=make('div','account'+(s.ok?'':' bad'));
  const percent=s.ok&&s.limit?Math.round(s.used/s.limit*100):0;
  const ring=make('div','ring');ring.style.setProperty('--p',percent);ring.style.setProperty('--c',a.color);
  ring.append(make('span','',s.ok?percent+'%':'!'));
  const info=make('div','accountInfo');
  info.append(make('div','accountName',a.name));
  info.append(make('div','email',s.ok?(s.email||'Google Drive account'):'সংযোগ হয়নি'));
  info.append(make('div','space',s.ok?'খালি '+formatSize(s.free):'URL / password পরীক্ষা করুন'));

  const actions=make('div','actions');
  const picker=make('input');picker.type='file';picker.multiple=true;picker.hidden=true;
  picker.setAttribute('aria-label',a.name+' এ ফাইল নির্বাচন');
  const button=make('button','uploadCircle','↑');button.type='button';button.title=a.name+' এ আপলোড';
  button.disabled=!s.ok||a.uploading;
  if(a.uploading)button.classList.add('busy');
  const activity=make('div','actStatus '+(a.activityKind||''),a.activity||'অপেক্ষমাণ');
  activity.id='activity-'+index;
  const mini=make('div','mini'+(a.uploading?' show':''));mini.id='mini-'+index;
  const miniBar=make('i');mini.append(miniBar);miniBar.id='miniBar-'+index;
  button.onclick=()=>picker.click();
  picker.onchange=async()=>{
   const selected=[...picker.files];if(!selected.length)return;
   if(a.uploading){showStatus(a.name+'-এ আপলোড চলছে।','err');return;}
   a.uploading=true;button.disabled=true;button.classList.add('busy');mini.classList.add('show');
   setActivity(a,index,'আপলোড শুরু হচ্ছে…','busy');
   let success=0,failed=[];
   try{
    for(let i=0;i<selected.length;i++){
     const file=selected[i];
     setActivity(a,index,(i+1)+'/'+selected.length+' • '+file.name,'busy');
     try{
      await uploadFile(file,a,p=>{
       setActivity(a,index,(i+1)+'/'+selected.length+' • '+Math.round(p)+'%','busy');
       miniBar.style.width=p+'%';
      });
      success++;
      if(a.space)a.space.free=Math.max(0,a.space.free-file.size);
     }catch(err){failed.push(file.name);setActivity(a,index,'ব্যর্থ: '+file.name,'err');}
    }
    setActivity(a,index,failed.length?'সফল '+success+', ব্যর্থ '+failed.length:'✓ '+success+'টি আপলোড সম্পন্ন',failed.length?'err':'ok');
    showStatus(a.name+' — সফল '+success+'টি, ব্যর্থ '+failed.length+'টি',failed.length?'err':'ok');
    await loadFiles();
   }finally{
    a.uploading=false;button.disabled=!(a.space&&a.space.ok);button.classList.remove('busy');mini.classList.remove('show');picker.value='';
    await loadSpace();
   }
  };
  actions.append(button,activity,mini,picker);
  card.append(ring,info,actions);box.append(card);
 });
 renderStorage();fillAccountSelect();
}

function setActivity(account,index,message,kind=''){
 account.activity=message;account.activityKind=kind;
 const element=$('activity-'+index);
 if(element){element.textContent=message;element.className='actStatus '+kind;}
}

async function loadSpace(){
 const results=await Promise.all(accounts.map(a=>get(a,'action=space').catch(()=>({ok:false}))));
 results.forEach((r,i)=>accounts[i].space=r);
 renderAccounts();renderStorage();fillAccountSelect();
}

function base64(blob){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>resolve(String(reader.result).split(',')[1]);
  reader.onerror=()=>reject(new Error('ফাইল পড়া যায়নি'));
  reader.readAsDataURL(blob);
 });
}

async function uploadFile(file,account,onProgress){
 if(!account.space?.ok)throw new Error('অ্যাকাউন্ট সংযুক্ত নেই');
 if(account.space.free<file.size*2.2+1e6)throw new Error('অ্যাকাউন্টে পর্যাপ্ত জায়গা নেই');
 const total=Math.max(1,Math.ceil(file.size/CHUNK_SIZE));
 const uploadId=Date.now()+'_'+Math.random().toString(36).slice(2,9);
 for(let i=0;i<total;i++){
  const chunk=file.slice(i*CHUNK_SIZE,(i+1)*CHUNK_SIZE);
  const data=await base64(chunk);
  const result=await post(account,{
   action:'upload_chunk',uploadId,index:i,total,data,
   name:file.name,mime:file.type||'application/octet-stream'
  });
  if(!result.ok)throw new Error(result.error||'আপলোড ব্যর্থ');
  if(onProgress)onProgress((i+1)/total*100);
 }
}

function chooseAccount(file){
 const selected=$('accountSelect').value;
 const needed=file.size*2.2+1e6;
 if(selected!=='auto'){
  const a=accounts[Number(selected)];
  if(!a?.space?.ok)throw new Error('অ্যাকাউন্ট সংযুক্ত নেই');
  if(a.uploading)throw new Error(a.name+'-এ অন্য আপলোড চলছে');
  if(a.space.free<needed)throw new Error(a.name+'-এ জায়গা কম');
  return a;
 }
 const available=accounts.filter(a=>a.space?.ok&&!a.uploading&&a.space.free>=needed).sort((a,b)=>b.space.free-a.space.free);
 if(!available.length)throw new Error('কোনো অ্যাকাউন্টে পর্যাপ্ত জায়গা নেই');
 return available[0];
}

async function uploadSelected(){
 const files=[...$('fileInput').files];
 if(!files.length){showStatus('আগে ফাইল নির্বাচন করুন।','err');return;}
 $('uploadButton').disabled=true;$('overallProgress').style.display='block';
 $('overallBar').style.width='0%';
 let success=0,failed=[];
 try{
  for(let i=0;i<files.length;i++){
   const file=files[i];
   try{
    const a=chooseAccount(file);
    showStatus(a.name+'-এ আপলোড হচ্ছে: '+file.name);
    await uploadFile(file,a,p=>{
     $('overallBar').style.width=((i+p/100)/files.length*100)+'%';
     showStatus(a.name+' • '+file.name+' • '+Math.round(p)+'%');
    });
    success++;a.space.free=Math.max(0,a.space.free-file.size);
    a.activity='✓ আপলোড সম্পন্ন: '+file.name;a.activityKind='ok';
   }catch(err){failed.push(file.name+': '+err.message);}
  }
  $('overallBar').style.width='100%';
  showStatus('সফল '+success+'টি, ব্যর্থ '+failed.length+'টি'+(failed.length?' • '+failed.slice(0,2).join(' | '):''),failed.length?'err':'ok');
  $('fileInput').value='';showPickedFiles();
  if(success)await Promise.all([loadSpace(),loadFiles()]);
 }finally{
  $('uploadButton').disabled=false;
  setTimeout(()=>$('overallProgress').style.display='none',2000);
 }
}

async function loadFiles(){
 const box=$('files');box.innerHTML='';
 const results=await Promise.all(accounts.map(a=>get(a,'action=list').catch(()=>({files:[]}))));
 let count=0;
 results.forEach((result,index)=>{
  (result.files||[]).forEach(file=>{
   count++;
   const row=make('div','file');
   const ext=(file.name.split('.').pop()||'FILE').toLowerCase();
   const icon=make('div','fileIcon',ext.slice(0,4));
   const info=make('div','fileInfo');
   info.append(make('div','fileName',file.name),make('div','fileMeta',formatSize(file.size)+' • '+accounts[index].name));
   const actions=make('div','fileActions');
   const downloadBtn=make('button','smallBtn','↓ Download');
   downloadBtn.onclick=()=>downloadFile(accounts[index],file);
   const deleteBtn=make('button','smallBtn','মুছুন');
   deleteBtn.onclick=async()=>{
    if(!confirm('"'+file.name+'" মুছে ফেলবেন?'))return;
    try{
     const r=await post(accounts[index],{action:'delete',id:file.id});
     if(!r.ok)throw new Error(r.error||'মোছা যায়নি');
     showStatus('ফাইল মুছে ফেলা হয়েছে','ok');await Promise.all([loadSpace(),loadFiles()]);
    }catch(e){showStatus('ফাইল মোছা যায়নি: '+e.message,'err');}
   };
   actions.append(downloadBtn,deleteBtn);row.append(icon,info,actions);box.append(row);
  });
 });
 if(!count)box.append(make('div','empty','কোনো ফাইল নেই। উপরে আপলোড করুন।'));
 searchFiles();
}

async function downloadFile(account,file){
 const index=accounts.indexOf(account);
 account.activity='ডাউনলোড শুরু হচ্ছে: '+file.name;account.activityKind='busy';
 updateActivity(index,account.activity,'busy');
 const parts=[];let total=1;
 try{
  for(let i=0;i<total;i++){
   showStatus('ডাউনলোড হচ্ছে: '+file.name+' • '+Math.round(i/total*100)+'%');
   const result=await get(account,'action=download&id='+encodeURIComponent(file.id)+'&index='+i);
   if(!result.ok)throw new Error(result.error||'ডাউনলোড ব্যর্থ');
   total=result.total;
   const binary=atob(result.data),bytes=new Uint8Array(binary.length);
   for(let j=0;j<binary.length;j++)bytes[j]=binary.charCodeAt(j);
   parts.push(bytes);
   account.activity='ডাউনলোড হচ্ছে '+Math.round((i+1)/total*100)+'%';
   updateActivity(index,account.activity,'busy');
  }
  const url=URL.createObjectURL(new Blob(parts,{type:file.mimeType||'application/octet-stream'}));
  const link=document.createElement('a');link.href=url;link.download=file.name;document.body.append(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
  account.activity='✓ ডাউনলোড সম্পন্ন: '+file.name;account.activityKind='ok';
  showStatus('ডাউনলোড সম্পন্ন: '+file.name,'ok');
  updateActivity(index,account.activity,'ok');
 }catch(e){
  account.activity='ডাউনলোড ব্যর্থ: '+e.message;account.activityKind='err';
  updateActivity(index,account.activity,'err');showStatus(account.activity,'err');
 }
}
function updateActivity(index,message,kind){
 const element=$('activity-'+index);
 if(element){element.textContent=message;element.className='actStatus '+kind;}
}

function showPickedFiles(){
 const files=[...$('fileInput').files];
 $('dropTitle').textContent=files.length?files.length+'টি ফাইল নির্বাচন করা হয়েছে':'ফাইল বাছুন অথবা এখানে টেনে আনুন';
 $('dropInfo').textContent=files.length?'মোট '+formatSize(files.reduce((sum,f)=>sum+f.size,0))+' • '+files.slice(0,3).map(f=>f.name).join(', ')+(files.length>3?' ...':''):'একসঙ্গে একাধিক ফাইল নির্বাচন করা যাবে';
}
$('fileInput').addEventListener('change',showPickedFiles);
$('uploadButton').addEventListener('click',uploadSelected);

const dz=$('dropZone');
['dragenter','dragover'].forEach(type=>dz.addEventListener(type,e=>{e.preventDefault();dz.classList.add('on');}));
['dragleave','drop'].forEach(type=>dz.addEventListener(type,e=>{e.preventDefault();dz.classList.remove('on');}));
dz.addEventListener('drop',e=>{
 const files=e.dataTransfer?.files;if(!files?.length)return;
 const dt=new DataTransfer();Array.from(files).forEach(f=>dt.items.add(f));
 $('fileInput').files=dt.files;showPickedFiles();
});

function searchFiles(){
 const query=$('fileSearch').value.trim().toLocaleLowerCase();
 const rows=[...$('files').querySelectorAll('.file')];let found=0;
 rows.forEach(row=>{
  const name=row.querySelector('.fileName')?.textContent||'';
  const visible=name.toLocaleLowerCase().includes(query);row.style.display=visible?'':'none';
  if(visible)found++;
 });
 let empty=$('searchEmpty');
 if(query&&found===0&&rows.length){
  if(!empty){empty=make('div','empty','কোনো ফাইল পাওয়া যায়নি');empty.id='searchEmpty';$('files').append(empty);}
  empty.style.display='';
 }else if(empty)empty.style.display='none';
}
$('fileSearch').addEventListener('input',searchFiles);
$('clearSearch').onclick=()=>{$('fileSearch').value='';searchFiles();};

async function refreshAll(){
 try{await Promise.all([loadSpace(),loadFiles()]);}
 catch(e){showStatus('ডেটা লোড সমস্যা: '+e.message,'err');}
}
function startApp(key){KEY=key;document.body.classList.add('in');fillAccountSelect();refreshAll();}

function checkPassword(key){
 if(!accounts.length)return Promise.resolve('error');
 return new Promise(resolve=>{
  let remaining=accounts.length,finished=false,reachable=false;
  accounts.forEach(a=>{
   fetch(a.url+'?key='+encodeURIComponent(key)+'&action=space')
    .then(r=>r.json()).then(result=>{
     reachable=true;
     if(result.ok&&!finished){finished=true;resolve('ok');}
     else if(--remaining===0&&!finished)resolve(reachable?'bad':'error');
    }).catch(()=>{
     remaining--;
     if(remaining===0&&!finished)resolve(reachable?'bad':'error');
    });
  });
 });
}
$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();$('loginButton').disabled=true;$('loginError').textContent='পাসওয়ার্ড যাচাই হচ্ছে...';
 try{
  const result=await checkPassword($('password').value);
  if(result==='ok'){
   KEY=$('password').value;
   try{sessionStorage.setItem('mds_key',KEY);}catch(e){}
   $('loginError').textContent='';startApp(KEY);
  }else $('loginError').textContent=result==='bad'?'পাসওয়ার্ড ভুল অথবা কোনো অ্যাকাউন্টে সংযোগ নেই':'Apps Script URL / Internet পরীক্ষা করুন';
 }finally{$('loginButton').disabled=false;}
});
$('logoutButton').onclick=()=>{try{sessionStorage.removeItem('mds_key');}catch(e){}location.reload();};
$('refreshButton').onclick=refreshAll;

$('menuToggle').onclick=()=>{$('menuPanel').hidden=!$('menuPanel').hidden;};
document.addEventListener('click',e=>{
 if(!e.target.closest('.menuWrap'))$('menuPanel').hidden=true;
});
$('showAccounts').onchange=()=>{
 $('accountsSection').hidden=!$('showAccounts').checked;
 try{localStorage.setItem('mds_show_accounts',$('showAccounts').checked?'1':'0');}catch(e){}
};
try{
 const v=localStorage.getItem('mds_show_accounts');
 if(v!==null)$('showAccounts').checked=v!=='0';
 $('accountsSection').hidden=!$('showAccounts').checked;
}catch(e){}

let savedKey=null;
try{savedKey=sessionStorage.getItem('mds_key');}catch(e){}
if(savedKey){
 startApp(savedKey);
 checkPassword(savedKey).then(r=>{
  if(r==='bad'){try{sessionStorage.removeItem('mds_key');}catch(e){}location.reload();}
 });
}
</script>
